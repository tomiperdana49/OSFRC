# Copy this file to /etc/nginx/sites-available/osfrc.nusa.net.id on the server,
# then: ln -s /etc/nginx/sites-available/osfrc.nusa.net.id /etc/nginx/sites-enabled/
# Run `certbot --nginx -d osfrc.nusa.net.id` afterwards to add SSL automatically.

server {
    listen 80;
    server_name osfrc.nusa.net.id;

    # Backend API (NestJS on 127.0.0.1:3000), stripped of the /api/ prefix
    location /api/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded ticket attachment files served by the backend
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000/uploads/;
        proxy_set_header Host $host;
    }

    # Frontend static build (React SPA)
    root /var/www/osfrc/frontend/dist;
    index index.html;

    location / {
        try_files $uri /index.html;
    }
}
